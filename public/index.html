<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>FitTrack Pro — 1-on-1 Fitness Coaching & Performance Tracking</title>
    <meta
      name="description"
      content="Personalized fitness coaching, tailored workout routines, custom diet plans, and real-time performance tracking."
    />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#080A0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <meta name="application-name" content="FitTrack" />
    <meta name="msapplication-TileColor" content="#080A0C" />

    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Links & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Style Reset & Anti-flicker Background -->
    <style id="fittrack-pwa-reset">
      html,
      body {
        height: 100%;
        background-color: #080A0C;
        margin: 0;
        padding: 0;
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }
      body {
        overflow-x: hidden;
      }
      #root {
        display: flex;
        min-height: 100%;
        flex: 1;
        background-color: #080A0C;
      }
      /* Custom scrollbar for modern browsers */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080A0C;
      }
      ::-webkit-scrollbar-thumb {
        background: #20262D;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="color: #ffffff; background-color: #080A0C; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; text-align: center; padding: 20px;">
        <h2>JavaScript is required to run FitTrack Pro.</h2>
      </div>
    </noscript>

    <div id="root">
      <div id="pwa-native-splash" style="position: fixed; inset: 0; background-color: #080A0C; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; user-select: none;">
        <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(199,240,0,0.14) 0%, rgba(199,240,0,0.03) 45%, rgba(8,10,12,0) 70%); pointer-events: none;"></div>
          <svg width="96" height="96" viewBox="0 0 96 96" style="position: relative; z-index: 1;">
            <rect width="96" height="96" rx="27" fill="#151A1F"/>
            <g transform="translate(23, 23) scale(2.083)" fill="none" stroke="#C7F000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/>
              <path d="m2.5 21.5 1.4-1.4"/>
              <path d="m20.1 3.9 1.4-1.4"/>
              <path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/>
              <path d="m9.6 14.4 4.8-4.8"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              installingWorker.onstatechange = function() {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New update available
                  console.log('New FitTrack version available.');
                }
              };
            };
          }).catch(function(err) {
            console.log('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
